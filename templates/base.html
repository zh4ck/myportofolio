{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <meta name="description" content="{{ full_name }} — Information Systems student at Universitas Indonesia.">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block meta %}
    <title>{{ name }} — Portfolio</title>
    {% endblock meta %}
</head>
<body>
    <header class="site-nav" aria-label="Primary navigation">
        <nav class="site-nav__links">
            <a href="{% url 'main:show_main' %}" class="{% block nav_home %}{% endblock nav_home %}" data-nav="HOME">HOME</a>
            <a href="{% url 'main:show_experience' %}" class="{% block nav_exp %}{% endblock nav_exp %}" data-nav="EXPERIENCE">EXP</a>
            <a href="{% url 'main:show_project' %}" class="{% block nav_project %}{% endblock nav_project %}" data-nav="PROJECT">PROJECT</a>
        </nav>
    </header>
    {% block content %}
    
    {% endblock content %}
    <footer class="site-footer">
        <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
    </footer>
</body>
</html>
